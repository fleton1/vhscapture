name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Create Xcode project
      run: |
        # Note: This assumes you have an Xcode project committed
        # If not, you'll need to create it as part of the workflow
        echo "Checking for Xcode project..."
        if [ ! -f "VHSCapture.xcodeproj/project.pbxproj" ]; then
          echo "⚠️  Xcode project not found. Please commit VHSCapture.xcodeproj to the repository."
          exit 1
        fi

    - name: Build app
      run: |
        chmod +x scripts/build.sh
        ./scripts/build.sh

    - name: Create DMG
      run: |
        chmod +x scripts/create-dmg.sh
        ./scripts/create-dmg.sh

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: VHSCapture-DMG
        path: dmg/*.dmg

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dmg/*.dmg
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
